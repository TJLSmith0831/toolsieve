name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # PyPI Trusted Publishing mints a short-lived token from this — no stored secret.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already tagged
        id: check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/extract_release_notes.py --version "${{ steps.version.outputs.version }}" > release_notes.md
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md

      # Dormant until the PYPI_AUTOPUBLISH repo variable is set to 'true'
      # (Settings → Secrets and variables → Actions → Variables). 0.3.0 gets
      # published by hand first so the first-ever release is one a human checked
      # — PyPI versions cannot be overwritten or deleted (D15).
      - uses: astral-sh/setup-uv@v3
        if: steps.check.outputs.exists == 'false' && vars.PYPI_AUTOPUBLISH == 'true'

      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false' && vars.PYPI_AUTOPUBLISH == 'true'
        run: |
          uv build
          uv publish --trusted-publishing always
