name: Update Changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    if: github.event.pull_request.merged == true && !startsWith(github.event.pull_request.title, 'docs: update changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Append changelog entry
        run: |
          python3 scripts/update_changelog.py \
            --pr "${{ github.event.pull_request.number }}" \
            --title "${{ github.event.pull_request.title }}" \
            --url "${{ github.event.pull_request.html_url }}"

      - name: Open changelog PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog changes"
            exit 0
          fi
          branch="changelog/pr-${{ github.event.pull_request.number }}"
          git checkout -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for #${{ github.event.pull_request.number }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "docs: update changelog for #${{ github.event.pull_request.number }}" \
            --body "Auto-generated changelog entry for #${{ github.event.pull_request.number }}."
